services:

  frontend:
    image: maxandreev27/time-app-frontend-dev
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - api

  api:
    image: maxandreev27/time-app-api-dev
    restart: always
    ports:
      - '5555:5000'
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: time_db

  mysql:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: time_db
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql_data_pub:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - '8888:8080'
    depends_on:
      - mysql

volumes:
  mysql_data_pub: